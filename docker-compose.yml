version: '3.9'

# ════════════════════════════════════════════════════════════════════════════
# Insurance Monolith — Docker Compose
#
# MONOLITH CONVERSION NOTE: replaces the original 26-service compose file
# (12 app services + eureka + api-gateway + kafka + zookeeper + kafka-ui +
# pgadmin + redis-commander + mailhog + prometheus + grafana + postgres +
# redis + minio) with this one. Removed entirely because the monolith has
# no more use for them:
#   - eureka-server, api-gateway  — no service discovery/routing needed
#     when there's only one service.
#   - kafka, zookeeper, kafka-ui  — cross-module events are in-process
#     Spring ApplicationEvents now (see com.insurance.monolith.events).
# Kept: postgres (now ONE database, not 12), redis, minio (document
# storage), mailhog (dev SMTP capture), prometheus + grafana (still
# meaningful — see infra/prometheus.yml, now a single scrape target).
# pgadmin/redis-commander were dev conveniences pointed at 12 databases/one
# redis; still useful, kept below, pointed at the single database.
# ════════════════════════════════════════════════════════════════════════════

services:

  # ── Infrastructure ──────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: insurance-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Single database now — the merged single-schema decision (see
      # MONOLITH-CONVERSION-NOTES.md). No init-multiple-dbs.sh needed
      # anymore; POSTGRES_DB alone creates it.
      POSTGRES_DB: insurance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - insurance-net

  redis:
    image: redis:7-alpine
    container_name: insurance-redis
    command: redis-server --requirepass ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - insurance-net

  minio:
    image: minio/minio:latest
    container_name: insurance-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - insurance-net

  mailhog:
    image: mailhog/mailhog:latest
    container_name: insurance-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - insurance-net

  # ── The monolith ─────────────────────────────────────────────────────────

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insurance-monolith
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: insurance_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-change-in-production-min-32-chars}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      BOOTSTRAP_ADMIN_SECRET: ${BOOTSTRAP_ADMIN_SECRET:-}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/actuator/health"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 5
    networks:
      - insurance-net

  # ── Observability ────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: insurance-prometheus
    depends_on:
      - app
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - insurance-net

  grafana:
    image: grafana/grafana:latest
    container_name: insurance-grafana
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - insurance-net

  # ── Dev tools ────────────────────────────────────────────────────────────

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: insurance-pgadmin
    depends_on:
      - postgres
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@insurance.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - insurance-net

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: insurance-redis-commander
    depends_on:
      - redis
    ports:
      - "8091:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    networks:
      - insurance-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  insurance-net:
    driver: bridge
    name: insurance-net
